[project]
name = "auth-service"
version = "0.1.0"
description = "Granthan Authentication Service"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.100.0",
    "uvicorn>=0.22.0",
    "pydantic[email]>=2.0",
    "pydantic-settings>=2.0",
    "sqlalchemy>=2.0.0",
    "asyncpg>=0.28.0",
    "argon2-cffi>=23.1.0",
    "pyjwt[crypto]>=2.8.0",
    "redis>=5.0.0",
    "aiokafka>=0.10.0"
]

[dependency-groups]
dev = [
    "fakeredis[lua]>=2.40.0",
    "httpx>=0.28.1",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]
